name: 功能建议
description: 提出一个与“大纲-错题-复习-指数”闭环相关的建议。
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ashore 的 v0.1 聚焦本地优先的备考闭环。与题库、社区或云同步相关的建议也欢迎，但可能被安排到更后面的版本。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的工作方式哪里不够顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 描述交互或数据上的变化，不必写实现。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 今日
        - 考点
        - 错题
        - 复习
        - 复盘
        - 设置 / 数据
        - 开源与工程
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
